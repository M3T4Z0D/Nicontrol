<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b33"/>
      <stop offset="55%" stop-color="#070d1a"/>
      <stop offset="100%" stop-color="#0e2a4a"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Faceted crystal octagon shield -->
  <polygon points="84,18 172,18 238,84 238,172 172,238 84,238 18,172 18,84"
           fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Inner crystal facet highlight -->
  <polygon points="90,32 166,32 224,90 224,166 166,224 90,224 32,166 32,90"
           fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>
  <!-- Diagonal crystal sheen -->
  <polygon points="36,144 144,36 176,36 36,176" fill="#38bdf8" fill-opacity="0.08"/>
  <!-- Geometric Nicontrol 'N' prism -->
  <polygon points="72,68 98,68 98,188 72,174" fill="url(#nGrad)"/>
  <polygon points="158,82 184,68 184,188 158,188" fill="url(#nGrad)"/>
  <polygon points="74,68 102,68 182,188 154,188" fill="#f0f9ff" fill-opacity="0.95"/>
</svg>
