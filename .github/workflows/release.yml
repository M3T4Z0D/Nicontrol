name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config zip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run tests & clippy
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package .zip archive
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          PKG_DIR="nicontrol-${TAG}-linux-x86_64"
          mkdir -p "$PKG_DIR/assets"
          cp target/release/nicontrol "$PKG_DIR/"
          cp install.sh README.md LICENSE "$PKG_DIR/"
          cp assets/nicontrol.desktop assets/nicontrol.png assets/99-nicontrol.rules "$PKG_DIR/assets/"
          chmod +x "$PKG_DIR/nicontrol" "$PKG_DIR/install.sh"
          zip -r "${PKG_DIR}.zip" "$PKG_DIR"

      - name: Install cargo-deb & build .deb package
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build

      - name: Upload .deb artifact for APT repo
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: target/debian/*.deb

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nicontrol-*-linux-x86_64.zip
            target/debian/*.deb
          generate_release_notes: true

  publish-apt-repo:
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout existing gh-pages (if any)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: apt-repo

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: apt-repo/pool/main

      - name: Generate APT metadata
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          cd apt-repo
          dpkg-scanpackages --multiversion pool/main > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Nicontrol" \
            -o APT::FTPArchive::Release::Label="Nicontrol" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/stable > dists/stable/Release

          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              -abs -u "$KEY_ID" -o dists/stable/Release.gpg dists/stable/Release
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --clearsign -u "$KEY_ID" -o dists/stable/InRelease dists/stable/Release
            gpg --armor --export "$KEY_ID" > pubkey.gpg
          fi

      - name: Deploy APT repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          keep_files: true
